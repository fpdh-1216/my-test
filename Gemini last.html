<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2023년 9월 풀버전 PC 견적소</title>
<style>
body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
.container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
.form-group { margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-bottom: 10px; color: #34495e; font-size: 16px; }
select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; outline: none; }
.total-price-box { margin-top: 40px; padding: 20px; background-color: #e8f6f3; border-radius: 8px; text-align: right; }
.total-price-box span.label { font-size: 20px; font-weight: bold; color: #16a085; }
.total-price-box span#total { font-size: 32px; font-weight: bold; color: #e74c3c; margin-left: 15px; }
</style>
</head>

<option value="1005480">ASUS ROG CROSSHAIR X670E HERO (ST) (1,005,480원)</option>

<div class="form-group">
<label for="case">4. Case (케이스)</label>

</div>

<!-- 총 합계 출력 -->
<div class="total-price-box">
<span class="label">총 예상 금액:</span>
<span id="total">0</span> <span style="font-size:24px; font-weight:bold; color: #e74c3c;">원</span>
</div>
</div>

<script>
function calculateTotal() {
const cpuPrice = parseInt(document.getElementById('cpu').value) || 0;
const mbPrice = parseInt(document.getElementById('mb').value) || 0;
const gpuPrice = parseInt(document.getElementById('gpu').value) || 0;
const casePrice = parseInt(document.getElementById('case').value) || 0;

const totalPrice = cpuPrice + mbPrice + gpuPrice + casePrice;
document.getElementById('total').innerText = totalPrice.toLocaleString();
}
</script>

</body>
</html>
