const tabs={CPU:"CPU",GPU:"그래픽카드",MB:"메인보드",CASE:"케이스",CONFIG:"9월 추천 견적"};
let cat="CPU",build={};
const $=id=>document.getElementById(id), won=n=>n.toLocaleString("ko-KR")+"원";
function renderTabs(){ $("tabs").innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="tab ${k===cat?'active':''}" onclick="cat='${k}';render()">${v}</button>`).join("")}
function list(){
 if(cat==="CONFIG") return D.configs.map((x,i)=>({name:x.title,price:null,idx:i,config:true}));
 let a=D[cat==="CPU"?"cpus":cat==="GPU"?"gpus":cat==="MB"?"mbs":"cases"].map((x,i)=>({...x,idx:i}));
 let q=$("search").value.trim().toLowerCase(); if(q)a=a.filter(x=>x.name.toLowerCase().includes(q));
 a.sort((x,y)=>$("sort").value==="name"?x.name.localeCompare(y.name):((x.price||0)-(y.price||0))); return a;
}
function card(x){
 if(x.config)return `<div class="card" onclick="showConfig(${x.idx})"><b>${x.name}</b><div class="spec">2023년 9월 원본 추천 견적</div><div class="hint">클릭하여 전체 구성 보기</div></div>`;
 let k=cat; let selected=build[k]?.name===x.name;
 let spec=k==="CPU"?`게임 상대 ${x.game??"-"} · 멀티 ${x.multi??"-"}`:k==="GPU"?`FHD ${x.fhd??"-"} · QHD ${x.qhd??"-"} · 4K ${x.uhd??"-"}`:k==="MB"?`${x.ethernet} · ${x.storage}`:`${x.type} · GPU ${x.gpu}`;
 return `<div class="card ${selected?'selected':''}" onclick="showProduct('${k}',${x.idx})"><b>${x.name}</b><div class="spec">${spec}</div><div class="price">${won(x.price)}</div><div class="hint">클릭: 상세정보 · 팝업에서 견적 추가</div></div>`;
}
function render(){renderTabs();$("cards").innerHTML=list().map(card).join("");update()}
function showProduct(k,i){
 let x=D[k==="CPU"?"cpus":k==="GPU"?"gpus":k==="MB"?"mbs":"cases"][i];
 let entries=k==="CPU"?[
 ["제품명",x.name],["9월 가격",won(x.price)],["게임 상대 성능",x.game??"-"],["멀티스레드 상대 성능",x.multi??"-"],["쿨러 참고가격",x.cooler?won(x.cooler):"자료 없음"],["보드 참고가격",x.board?won(x.board):"자료 없음"]
 ]:k==="GPU"?[
 ["제품명",x.name],["약칭",x.abbr],["9월 가격",won(x.price)],["두께",x.thickness],["FHD 상대 성능",x.fhd??"-"],["QHD 상대 성능",x.qhd??"-"],["4K 상대 성능",x.uhd??"-"],["특이사항",x.note||"없음"]
 ]:k==="MB"?[
 ["제품명",x.name],["최저 가격",won(x.price)],["전원부",x.power],["MOSFET",x.mosfet],["이더넷",x.ethernet],["오디오",x.audio],["저장장치",x.storage],["Wi-Fi",x.wifi]
 ]:[
 ["제품명",x.name],["8월 가격",won(x.price)],["케이스 분류",x.type],["조립 난이도",x.difficulty],["기본 쿨링",x.cooling],["그래픽카드 길이",x.gpu],["CPU 쿨러 높이",x.cpu]
 ];
 $("modalBody").innerHTML=`<h2>${x.name}</h2><div class="detail">${entries.map(e=>`<div>${e[0]}</div><div>${String(e[1]).replaceAll("\\n","<br>")}</div>`).join("")}</div><button class="btn primary" style="margin-top:14px;width:100%" onclick="add('${k}',${i})">견적에 추가</button>`;
 $("modal").classList.add("show");
}
function showConfig(i){let x=D.configs[i];$("modalBody").innerHTML=`<h2>${x.title}</h2>${x.rows.map((r,i)=>`<div class="configrow"><strong>${i<8?["CPU","쿨러","메인보드","메모리","그래픽/내장그래픽","SSD","파워","케이스"][i]:"참고"}</strong><pre>${r}</pre></div>`).join("")}`;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
function add(k,i){let key=k==="CPU"?"cpus":k==="GPU"?"gpus":k==="MB"?"mbs":"cases";build[k]=D[key][i];closeModal();render()}
function update(){
 let total=Object.values(build).reduce((s,p)=>s+(p?.price||0),0);$("total").textContent=won(total);$("bar").style.width=Math.min(100,total/(+$("budget").value||1)*100)+"%";
 $("rows").innerHTML=Object.entries(build).map(([k,p])=>`<div class="partrow"><span>${tabs[k]}<br><small>${p.name}</small></span><span>${won(p.price)}</span></div>`).join("");
 let msg=[];
 if(build.CPU&&build.MB){
   const n=build.CPU.name.toLowerCase(),m=build.MB.name.toLowerCase();
   if((n.includes("라이젠")||n.includes("ryzen")) && !/(b650|x670|x670e|b650e)/i.test(m))msg.push(`<span class="warn">AMD Ryzen 7000 계열과 메인보드 칩셋을 확인하세요.</span>`);
   if(n.match(/12|13|12400|12600|12700|12900|13400|13500|13600|13700|13900/) && /x670|b650/i.test(m))msg.push(`<span class="warn">Intel CPU와 AMD AM5 메인보드 조합인지 확인하세요.</span>`);
 }
 if(!msg.length)msg.push(`<span class="ok">기본 선택 상태입니다. 호환성은 실제 구매 전 개별 모델의 소켓·메모리 규격을 다시 확인하세요.</span>`);
 $("compat").innerHTML=msg.join("<br>");
}
function autoBuild(){
 let b=+$("budget").value||1500000;
 let cpu=D.cpus.slice().sort((a,b)=>a.price-b.price).filter(x=>x.price<Math.min(700000,b*.28))[0]||D.cpus[0];
 let gpu=D.gpus.slice().sort((a,b)=>a.price-b.price).filter(x=>x.price<Math.min(2500000,b*.55)).slice(-1)[0]||D.gpus[0];
 let mb=D.mbs.slice().sort((a,b)=>a.price-b.price).filter(x=>x.price<b*.2)[0]||D.mbs[0];
 let kase=D.cases.slice().sort((a,b)=>a.price-b.price)[Math.min(D.cases.length-1,Math.floor(D.cases.length*.35))];
 build={CPU:cpu,GPU:gpu,MB:mb,CASE:kase};render()
}
function resetBuild(){build={};render()}
$("budget").oninput=update;$("search").oninput=render;$("sort").onchange=render;render();
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
</script>
