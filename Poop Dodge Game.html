<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>똥 피하기 - 제한시간 100초 도전!</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  color: #fff;
  font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  background: linear-gradient(#b7e5ff, #e7f8ff 45%, #6dbb42 45%, #3d8b2e 100%);
  user-select: none;
  -webkit-user-select: none;
}
.wrap {
  width: min(100%, 520px);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
h1 {
  margin: 0;
  font-size: clamp(20px, 4.5vw, 28px);
  color: #183b20;
  text-shadow: 0 1px #fff8;
}
.hud {
  display: flex;
  gap: 6px;
}
.stat {
  background: #214b2de8;
  border: 1px solid #ffffff66;
  border-radius: 12px;
  padding: 6px 10px;
  min-width: 72px;
  text-align: center;
  transition: background 0.3s, border-color 0.3s;
}
.stat small {
  display: block;
  color: #d7f4d2;
  font-size: 11px;
}
.stat strong {
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat.warning {
  background: #991b1be8;
  border-color: #fca5a5;
  animation: pulse 0.8s infinite alternate;
}
.stat.warning strong {
  color: #fef08a;
}
@keyframes pulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.06); }
}
.arena {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: min(min(125vw, 68vh), 650px);
  min-height: 400px;
  background: linear-gradient(#bceaff 0%, #e6f9ff 40%, #8bd45a 40%, #5cae3d 100%);
  border: 3px solid #f4fff0;
  border-radius: 18px;
  box-shadow: 0 15px 35px #21451f55;
  touch-action: none;
  isolation: isolate;
}
.sun {
  position: absolute;
  top: 22px;
  right: 24px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #ffe66d;
  box-shadow: 0 0 0 10px #ffe66d33;
}
.cloud {
  position: absolute;
  top: 65px;
  left: 9%;
  width: 95px;
  height: 25px;
  border-radius: 30px;
  background: #fff;
  opacity: .85;
}
.cloud:before, .cloud:after {
  content: "";
  position: absolute;
  bottom: 0;
  border-radius: 50%;
  background: #fff;
}
.cloud:before { width: 37px; height: 37px; left: 15px; }
.cloud:after { width: 29px; height: 29px; left: 43px; }
.grass {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24%;
  background: repeating-linear-gradient(110deg, transparent 0 13px, #2d8128 14px 16px, transparent 17px 29px), linear-gradient(#65b943, #368b2b);
  opacity: .75;
  pointer-events: none;
}
.lane {
  position: absolute;
  top: 42%;
  bottom: 0;
  width: 2px;
  background: #f0ffe52b;
}
#player {
  position: absolute;
  width: 60px;
  height: 60px;
  bottom: 18px;
  left: calc(50% - 30px);
  z-index: 3;
  display: grid;
  place-items: center;
  font-size: 44px;
  line-height: 1;
  filter: drop-shadow(0 4px 2px #0005);
  user-select: none;
}
.entity {
  position: absolute;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 4px 3px #0004);
  z-index: 2;
}
.falling {
  width: 48px;
  height: 48px;
}
.overlay {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  background: #173b22d9;
  backdrop-filter: blur(2px);
}
.overlay.hidden { display: none; }
.overlay h2 { margin: 0 0 8px; font-size: 32px; color: #ffffff; text-shadow: 0 2px 4px #000; }
.overlay p { max-width: 340px; color: #f0ffeb; line-height: 1.65; margin: 6px 0 20px; font-size: 15px; }
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 26px;
  background: linear-gradient(180deg, #34d399, #059669);
  color: white;
  font-weight: 800;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 5px 0 #046c4b, 0 8px 15px #0004;
  transition: transform 0.1s;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #046c4b;
}
.progress {
  height: 9px;
  background: #214b2d88;
  border-radius: 99px;
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid #ffffff55;
}
.progress > div {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
  transition: width 0.2s linear;
}
.legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: #173b20;
  font-size: 13px;
  font-weight: 700;
}
.legend span { display: flex; align-items: center; gap: 6px; }
.legend img { width: 26px; height: 26px; object-fit: contain; }
.help {
  color: #183b20;
  font-size: 13px;
  line-height: 1.55;
  text-align: center;
  margin: 10px 0 0;
}
@media (max-width: 380px) {
  .stat { min-width: 62px; padding: 5px 6px; }
  .stat strong { font-size: 17px; }
  #player { width: 50px; height: 50px; font-size: 38px; }
  .falling { width: 42px; height: 42px; }
  .arena { min-height: 380px; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>똥 피하기</h1>
    <div class="hud">
      <div class="stat"><small>점수</small><strong id="score">0</strong></div>
      <div class="stat"><small>최고 점수</small><strong id="best">0</strong></div>
      <div class="stat" id="timeStat"><small>남은 시간</small><strong id="time">100</strong></div>
    </div>
  </header>

  <section class="arena" id="arena" aria-label="게임 화면">
    <div class="sun"></div><div class="cloud"></div><div class="grass"></div>
    <div class="lane" style="left:25%"></div><div class="lane" style="left:50%"></div><div class="lane" style="left:75%"></div>
    <div id="player" aria-label="플레이어 캐릭터">🧍</div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">똥 피하기</h2>
      <p id="overlayText">
        제한 시간 <b>100초</b> 안에 <b>150점</b>을 달성하세요!<br>
        • 버티기 1초당 +1점<br>
        • 무지개 똥 획득 시 +5점<br>
        • 시간이 지날수록 똥이 더 빠르고 빽빽하게 떨어집니다.
      </p>
      <button id="startBtn" type="button">게임 시작</button>
    </div>
  </section>

  <div class="progress"><div id="progressFill"></div></div>

  <div class="legend">
    <span><img id="legendBrown" alt="갈색 똥"> 갈색 똥: 피하기</span>
    <span><img id="legendRainbow" alt="무지개 똥"> 무지개 똥: +5점</span>
  </div>
  <p class="help">이동: ← → 또는 A / D · 마우스/터치 드래그로 조작</p>
</main>

<script>
// High-resolution SVG Vector Data URIs with zero background artifacts
const BROWN_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 8 C44 22 34 28 34 40 C25 40 18 48 18 58 C10 60 7 72 14 83 C21 93 35 95 50 95 C65 95 79 93 86 83 C93 72 90 60 82 58 C82 48 75 40 66 40 C66 28 56 22 50 8 Z' fill='%239e5e38' stroke='%2322130c' stroke-width='6' stroke-linejoin='round'/><path d='M36 43 Q50 51 64 43' fill='none' stroke='%2322130c' stroke-width='5' stroke-linecap='round'/><path d='M25 61 Q50 71 75 61' fill='none' stroke='%2322130c' stroke-width='5' stroke-linecap='round'/></svg>";

const RAINBOW_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='rg' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%23FFDD00'/><stop offset='25%25' stop-color='%2333FF44'/><stop offset='50%25' stop-color='%2300E5FF'/><stop offset='75%25' stop-color='%233344FF'/><stop offset='100%25' stop-color='%23FF00BB'/></linearGradient></defs><path d='M50 6 C42 22 32 28 32 40 C22 40 15 48 15 58 C7 60 4 72 11 84 C19 95 35 96 50 96 C65 96 81 95 89 84 C96 72 93 60 85 58 C85 48 78 40 68 40 C68 28 58 22 50 6 Z' fill='url(%23rg)' stroke='%23111' stroke-width='4' stroke-linejoin='round'/><ellipse cx='37' cy='52' rx='9' ry='12' fill='%23FFF' stroke='%23000' stroke-width='2'/><ellipse cx='37' cy='53' rx='4' ry='7' fill='%23000'/><ellipse cx='63' cy='52' rx='9' ry='12' fill='%23FFF' stroke='%23000' stroke-width='2'/><ellipse cx='63' cy='53' rx='4' ry='7' fill='%23000'/><path d='M34 71 Q50 83 66 71 Z' fill='%23FFF' stroke='%23000' stroke-width='3'/></svg>";

const $ = id => document.getElementById(id);

const arena = $('arena');
const player = $('player');
const scoreEl = $('score');
const bestEl = $('best');
const timeEl = $('time');
const timeStat = $('timeStat');
const overlay = $('overlay');
const overlayTitle = $('overlayTitle');
const overlayText = $('overlayText');
const startBtn = $('startBtn');
const progressFill = $('progressFill');

$('legendBrown').src = BROWN_SVG;
$('legendRainbow').src = RAINBOW_SVG;

const TARGET_SCORE = 150;
const TIME_LIMIT = 100;

let running = false;
let score = 0;
let timeLeft = TIME_LIMIT;
let elapsedTime = 0;
let lastFrame = 0;
let spawnTimer = 0;
let secondTimer = 0;
let objects = [];
let keys = new Set();
let playerX = 0;
let best = 0;
let raf = 0;

// Web Audio API Synthesizer
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'rainbow') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.18); // A5
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.start(now);
    osc.stop(now + 0.18);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'win') {
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, now + idx * 0.1);
      g.gain.setValueAtTime(0.25, now + idx * 0.1);
      g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
      o.start(now + idx * 0.1);
      o.stop(now + idx * 0.1 + 0.2);
    });
  }
}

// Load best score
try {
  best = Number(localStorage.getItem('poopDodgeBest') || 0);
} catch(e) {}
bestEl.textContent = best;

function setPlayerX(x) {
  const maxX = Math.max(0, arena.clientWidth - player.offsetWidth);
  playerX = Math.max(0, Math.min(maxX, x));
  player.style.left = playerX + 'px';
}

function clearObjects() {
  objects.forEach(o => o.el.remove());
  objects = [];
}

function spawnObject() {
  // 12% probability for rainbow poop
  const isRainbow = Math.random() < 0.12;
  const el = document.createElement('img');
  el.className = 'entity falling';
  el.src = isRainbow ? RAINBOW_SVG : BROWN_SVG;
  el.alt = isRainbow ? '무지개 똥' : '갈색 똥';
  
  const size = Math.max(40, Math.min(52, arena.clientWidth * 0.12));
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  
  const x = Math.random() * Math.max(1, arena.clientWidth - size);
  el.style.left = x + 'px';
  el.style.top = (-size) + 'px';
  arena.appendChild(el);
  
  // Speed scales smoothly from 270 px/s up to 550 px/s over 100 seconds
  const baseSpeed = 270 + (elapsedTime / 100) * 280 + Math.random() * 45;
  
  objects.push({
    el,
    x,
    y: -size,
    size,
    isRainbow,
    speed: baseSpeed
  });
}

function updateBest() {
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try {
      localStorage.setItem('poopDodgeBest', String(best));
    } catch(e) {}
  }
}

function endGame(reason) {
  running = false;
  cancelAnimationFrame(raf);
  overlay.classList.remove('hidden');

  if (reason === 'win') {
    playSound('win');
    overlayTitle.textContent = '🎉 승리!';
    overlayText.innerHTML = `목표 점수 <b>${TARGET_SCORE}점</b> 달성 성공!<br>최종 점수: <b>${score}점</b><br>남은 시간: <b>${timeLeft}초</b>`;
  } else if (reason === 'timeover') {
    playSound('hit');
    const needed = TARGET_SCORE - score;
    overlayTitle.textContent = '⏰ 시간 초과';
    overlayText.innerHTML = `100초가 종료되었습니다.<br>최종 점수: <b>${score}점</b><br>목표 150점에 <b>${needed}점</b>이 부족합니다!`;
  } else {
    playSound('hit');
    overlayTitle.textContent = '💥 게임 오버';
    overlayText.innerHTML = `갈색 똥에 맞았습니다!<br>최종 점수: <b>${score}점</b><br>목표 150점에 다시 도전해보세요.`;
  }
  startBtn.textContent = '다시 도전';
}

function startGame() {
  initAudio();
  cancelAnimationFrame(raf);
  clearObjects();
  
  score = 0;
  timeLeft = TIME_LIMIT;
  elapsedTime = 0;
  lastFrame = 0;
  spawnTimer = 0;
  secondTimer = 0;
  
  scoreEl.textContent = '0';
  timeEl.textContent = TIME_LIMIT;
  timeStat.classList.remove('warning');
  progressFill.style.width = '0%';
  
  setPlayerX((arena.clientWidth - player.offsetWidth) / 2);
  overlay.classList.add('hidden');
  running = true;
  raf = requestAnimationFrame(loop);
}

function loop(ts) {
  if (!running) return;
  if (!lastFrame) lastFrame = ts;
  const dt = Math.min((ts - lastFrame) / 1000, 0.04);
  lastFrame = ts;

  secondTimer += dt;
  spawnTimer += dt;

  // 1-Second Countdown & Survival Points
  while (secondTimer >= 1) {
    secondTimer -= 1;
    score++;
    timeLeft--;
    elapsedTime = TIME_LIMIT - timeLeft;

    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    updateBest();

    if (timeLeft <= 10) {
      timeStat.classList.add('warning');
    }

    if (score >= TARGET_SCORE) {
      endGame('win');
      return;
    }

    if (timeLeft <= 0) {
      if (score >= TARGET_SCORE) {
        endGame('win');
      } else {
        endGame('timeover');
      }
      return;
    }
  }

  // Horizontal Movement Controls
  const move = 340 * dt;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) setPlayerX(playerX - move);
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) setPlayerX(playerX + move);

  // Spawn frequency scaling: 0.52s down to 0.18s
  const currentSpawnInterval = Math.max(0.18, 0.52 - (elapsedTime / 100) * 0.34);
  if (spawnTimer >= currentSpawnInterval) {
    spawnTimer = 0;
    spawnObject();
  }

  // Falling objects collision detection
  const pr = player.getBoundingClientRect();
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    o.y += o.speed * dt;
    o.el.style.top = o.y + 'px';
    
    const r = o.el.getBoundingClientRect();
    const hit = pr.left + 10 < r.right - 8 &&
                pr.right - 10 > r.left + 8 &&
                pr.top + 8 < r.bottom - 8 &&
                pr.bottom - 6 > r.top + 8;

    if (hit) {
      if (o.isRainbow) {
        playSound('rainbow');
        score += 5;
        scoreEl.textContent = score;
        updateBest();
        o.el.remove();
        objects.splice(i, 1);
        
        if (score >= TARGET_SCORE) {
          endGame('win');
          return;
        }
        continue;
      }
      endGame('hit');
      return;
    }

    if (o.y > arena.clientHeight) {
      o.el.remove();
      objects.splice(i, 1);
    }
  }

  progressFill.style.width = Math.min(100, (score / TARGET_SCORE) * 100) + '%';
  raf = requestAnimationFrame(loop);
}

// Event Listeners
startBtn.addEventListener('click', startGame);

window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys.add(e.key);
  if (!running && (e.key === 'Enter' || e.key === ' ')) startGame();
});

window.addEventListener('keyup', e => keys.delete(e.key));
window.addEventListener('blur', () => keys.clear());

function pointerMove(e) {
  if (!running) return;
  const r = arena.getBoundingClientRect();
  setPlayerX(e.clientX - r.left - player.offsetWidth / 2);
}

arena.addEventListener('pointerdown', e => {
  if (!running) return;
  initAudio();
  try { arena.setPointerCapture(e.pointerId); } catch(err) {}
  pointerMove(e);
});

arena.addEventListener('pointermove', e => {
  if (e.buttons || e.pointerType === 'touch') pointerMove(e);
});

window.addEventListener('resize', () => setPlayerX(playerX));
window.addEventListener('load', () => setPlayerX((arena.clientWidth - player.offsetWidth) / 2));
</script>
</body>
</html>
